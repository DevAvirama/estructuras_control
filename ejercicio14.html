<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 14: Niveles de Riesgo</title>
    <link rel="stylesheet" href="assets/css/styles14.css">
</head>
<body>
    <a href="index.html" class="btn-back">⬅ Volver al Menú</a>

    <div class="safety-card">
        <div class="header-strip">SEGURIDAD INDUSTRIAL</div>
        <h1>Identificador de Riesgos</h1>
        <p>Ingrese el código de nivel (1-5)</p>

        <div class="control-panel">
            <input type="number" id="nivel" placeholder="#" min="1" max="5">
            <button onclick="identificarRiesgo()">CONSULTAR</button>
        </div>

        <div id="resultado" class="risk-display">
            <div class="placeholder-icon">🛡️</div>
            <div class="placeholder-text">Esperando consulta...</div>
        </div>
    </div>

    <script src="assets/js/main14.js"></script>
</body>
</html>
