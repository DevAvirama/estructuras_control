<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 4: Envíos TCC</title>
    <link rel="stylesheet" href="assets/css/styles4.css">
</head>
<body>
    <a href="index.html" class="btn-back">⬅ Volver al Menú</a>

    <div class="card">
        <div class="logo-area">
            <h1>TCC 📦</h1>
            <p>Calculadora de Envíos Internacionales</p>
        </div>

        <div class="form-content">
            <div class="input-group">
                <label for="peso">Peso del paquete (kg):</label>
                <input type="number" id="peso" placeholder="Ej: 34" step="0.1">
                <small>Máximo permitido: 85 kg</small>
            </div>

            <div class="input-group">
                <label for="zona">Zona de destino:</label>
                <select id="zona">
                    <option value="" disabled selected>-- Seleccione una zona --</option>
                    <option value="1">Zona 1 - América del Norte ($210)</option>
                    <option value="2">Zona 2 - América Central ($180)</option>
                    <option value="3">Zona 3 - América del Sur ($220)</option>
                    <option value="4">Zona 4 - Europa ($340)</option>
                    <option value="5">Zona 5 - Asia ($370)</option>
                </select>
            </div>

            <button onclick="calcularEnvio()">Consultar Valor</button>
        </div>

        <div id="resultado" class="result-box"></div>
    </div>

    <script src="assets/js/main4.js"></script>
</body>
</html>
