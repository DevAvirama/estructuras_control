<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 11: Calculadora IMC Olímpica</title>
    <link rel="stylesheet" href="assets/css/styles11.css">
</head>
<body>
    <a href="index.html" class="btn-back">⬅ Volver al Menú</a>

    <div class="olympic-card">
        <div class="header">
            <div class="rings">
                <span class="blue">O</span><span class="yellow">O</span><span class="black">O</span><span class="green">O</span><span class="red">O</span>
            </div>
            <h1>París 2024 🇫🇷</h1>
            <p>Evaluación Física de Atletas</p>
        </div>

        <div class="form-content">
            <div class="input-group">
                <label for="peso">Peso (kg):</label>
                <input type="number" id="peso" placeholder="Ej: 65">
            </div>

            <div class="input-group">
                <label for="altura">Estatura (metros):</label>
                <input type="number" id="altura" placeholder="Ej: 1.70" step="0.01">
            </div>

            <button onclick="calcularIMC()">Analizar Rendimiento</button>
        </div>

        <div id="resultado" class="result-box"></div>
    </div>

    <script src="assets/js/main11.js"></script>
</body>
</html>
