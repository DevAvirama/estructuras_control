<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 8: Mayor de Tres</title>
    <link rel="stylesheet" href="assets/css/styles8.css">
</head>
<body>
    <a href="index.html" class="btn-back">⬅ Volver al Menú</a>

    <div class="logic-card">
        <div class="header">
            <div class="icon">🔢</div>
            <h1>Comparador Numérico</h1>
            <p>Descubre cuál es el número mayor</p>
        </div>

        <div class="input-container">
            <div class="input-box">
                <label for="num1">Número 1</label>
                <input type="number" id="num1" placeholder="A">
            </div>
            
            <div class="input-box">
                <label for="num2">Número 2</label>
                <input type="number" id="num2" placeholder="B">
            </div>
            
            <div class="input-box">
                <label for="num3">Número 3</label>
                <input type="number" id="num3" placeholder="C">
            </div>
        </div>

        <button onclick="encontrarMayor()">Comparar</button>

        <div id="resultado" class="result-area"></div>
    </div>

    <script src="assets/js/main8.js"></script>
</body>
</html>
