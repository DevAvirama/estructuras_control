<!DOCTYPE html>
<html lang="es">
<head>

    <title>Ejercicio 13: Triángulos</title>
    <link rel="stylesheet" href="assets/css/styles13.css">
</head>
<body>
    <a href="index.html" class="btn-back">⬅ Volver al Menú</a>

    <div class="triangle-card">
        <div class="shape-icon">📐</div>
        <h1>Clasificador de Triángulos</h1>
        <p>Ingresa la longitud de los 3 lados</p>

        <div class="input-row">

            <input type="number" id="lado3" placeholder="Lado C" class="side-input">
        </div>

        <button onclick="clasificarTriangulo()">Identificar Tipo</button>

        <div id="resultado" class="result-box"></div>
    </div>

    <script src="assets/js/main13.js"></script>
